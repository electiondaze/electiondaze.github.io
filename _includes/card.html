<article class="card">
  {% if include.post.section %}<a class="label" href="{{ include.post.section | slugify | prepend: '/section/' | append: '/' | relative_url }}">{{ include.post.section }}</a>{% endif %}
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  {% if include.excerpt %}<p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 160 }}</p>{% endif %}
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
</article>
