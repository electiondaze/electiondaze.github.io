<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  {% if page.title %}
    <title>{{ page.title }} - {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }}</title>
  {% endif %}
  
  <meta name="description" content="{{ site.description }}">
  
  <!-- Hyde theme CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/poole/hyde@master/public/css/poole.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/poole/hyde@master/public/css/syntax.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/poole/hyde@master/public/css/hyde.css">
  
  <!-- Custom Black & White CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/hyde-black-white.css' | relative_url }}">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="sidebar">
    <div class="container sidebar-sticky">
      <div class="sidebar-about">
        <h1 class="sidebar-title">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>
        <p class="lead">{{ site.tagline }}</p>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="sidebar-nav-item{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about' | relative_url }}">About</a>
        <a class="sidebar-nav-item{% if page.url == '/resume/' %} active{% endif %}" href="{{ '/resume' | relative_url }}">Resume</a>
        <a class="sidebar-nav-item{% if page.url == '/training/' %} active{% endif %}" href="{{ '/training' | relative_url }}">Training</a>
        <a class="sidebar-nav-item" href="{{ site.author.link }}">Contact</a>
      </nav>

      <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="content">
      <div class="page">
        <h1 class="page-title">{{ page.title }}</h1>
        {{ content }}
      </div>
    </div>
  </div>
</body>
</html>
